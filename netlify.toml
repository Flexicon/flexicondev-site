[build]
  publish = "public"
  command = "make build"

[build.environment]
  HUGO_VERSION = "0.151.0"
  NODE_VERSION = "22.18.0"
  NPM_VERSION = "11.6.1"

[[redirects]]
  from = "https://flexicondev.com/*"
  to = "https://flexicon.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.flexicondev.com/*"
  to = "https://flexicon.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://blog.flexicondev.com/*"
  to = "https://blog.flexicon.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/relay-bbib/static/*"
  to = "https://eu-assets.i.posthog.com/static/:splat"
  host = "eu-assets.i.posthog.com"
  status = 200
  force = true

[[redirects]]
  from = "/relay-bbib/*"
  to = "https://eu.i.posthog.com/:splat"
  host = "eu.i.posthog.com"
  status = 200
  force = true

# Cache fingerprinted assets aggressively — filenames change on content change.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Exemption for meta images
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"

[[headers]]
  for = "/**.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
