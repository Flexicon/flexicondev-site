{{ with .Page.Resources.Get "work.json" }}
  {{ with . | transform.Unmarshal }}
    {{ range . }}
      {{ $company := .company }}
      <div class="work-item">
        <div class="work-item-header">
          {{ with $.Page.Resources.Get .logo }}
            <img class="work-item-logo" src="{{ .RelPermalink }}" alt="{{ $company }} logo" />
          {{ end }}
          <span>
            <strong>{{ .title }}</strong> at <a href="{{ .url }}">{{ .company }}</a> ({{ .period }})
          </span>
        </div>
        <ul class="work-item-highlights">
          {{ range .highlights }}
            <li>{{ . }}</li>
          {{ end }}
        </ul>
      </div>
    {{ end }}
  {{ end }}
{{ end }}
