{{ with .Page.Resources.Get "skills.json" }}{{ with . | transform.Unmarshal }}
<div class="print-only">
  <div class="print-block">
    {{ range $category, $skills := . }}
    <div class="print-block-row">
      <span class="print-block-label">{{ $category }}:</span>
      <span>{{ delimit $skills ", " }}</span>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}{{ end }}
