{{- $src := .Get "src" }}
{{- $img := .Page.Resources.GetMatch $src }}
{{- $resized := $img.Fill "240x240 webp center" }}
<figure>
  <img
    src="{{ $resized.RelPermalink }}"
    width="240"
    height="240"
    class="my-0 rounded-md nozoom {{ .Get "class" }}"
    alt="{{ .Get "alt" }}"
  />
</figure>
